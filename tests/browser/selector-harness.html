<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>content.js unique-selector harness</title>
</head>
<body>
  <!--
    Loads the REAL extension/src/content.js with a stubbed chrome.runtime (the
    pattern is proven), auto-starts capture, programmatically clicks a set
    of diverse elements, and self-checks every emitted selector: it must resolve to
    exactly ONE element, and that element must be the one we clicked. Results land
    in window.__results for a driver (Playwright) to read.

    Serve over HTTP (Playwright MCP blocks file:):
        python3 -m http.server 8123
        → http://localhost:8123/tests/browser/selector-harness.html
  -->

  <!-- 1. unique id -->
  <button id="save-btn">Save</button>

  <!-- 2. test-id attribute, non-unique tag -->
  <div data-testid="user-card">Card</div>

  <!-- 3. name attribute -->
  <input name="email-field" />

  <!-- 4. three sibling divs with nothing distinguishing — needs :nth-of-type -->
  <section id="siblings">
    <div class="row">one</div>
    <div class="row">two</div>
    <div class="row" data-pick="row3">three</div>
  </section>

  <!-- 5. the real-world failure: bare svg/path inside a wrapper -->
  <div class="chart-wrap">
    <svg width="20" height="20"><path d="M0 0 L10 10" data-pick="the-path"></path></svg>
  </div>

  <!-- 6. deeply nested element with no ids on the way up -->
  <main>
    <article><ul><li><span data-pick="deep-span">deep</span></li></ul></article>
  </main>

  <!-- ctx (semantic context) fixtures: name / role / section / input / select -->
  <section aria-label="Order actions">
    <button data-ctx="refund-btn">Issue refund</button>
  </section>
  <div>
    <label for="reason">Reason for refund</label>
    <input id="reason" type="text" data-ctx="reason-input" />
  </div>
  <section>
    <h2>Shipping</h2>
    <div><a href="/track/123" data-ctx="track-link">Track package</a></div>
  </section>
  <select data-ctx="state-select">
    <option>Draft</option>
    <option selected>Submitted</option>
  </select>

  <!-- B2: a secret input whose aria-labelledby points at text holding a token.
       describe() must NOT pull that into ctx.name (it suppresses name on a
       secret input), so the secret can't leak into timeline.json via ctx. -->
  <span id="otp-label">One-time code eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJhIjoiYiJ9.sig-xyz_123</span>
  <input type="password" aria-labelledby="otp-label" data-ctx="secret-input" />

  <script>
    // --- chrome.runtime stub: collect timeline events, auto-start recording ---
    window.__events = [];
    window.chrome = {
      runtime: {
        onMessage: { addListener() {} },
        sendMessage(msg, cb) {
          if (msg && msg.type === "timeline-event") window.__events.push(msg.event);
          // content.js asks "is-recording" on load; say yes so it self-attaches.
          if (typeof cb === "function") cb({ recording: true });
        },
      },
    };
  </script>

  <!-- 2. the code under test -->
  <script src="../../extension/src/content.js"></script>

  <script>
    // --- 3. drive clicks and self-check the emitted selectors ----------------
    function run() {
      // Stop real navigation/submit so clicking the <a> doesn't leave the page
      // (content.js still sees the event — both listeners are capture-phase).
      document.addEventListener("click", (e) => e.preventDefault(), true);
      const targets = [
        document.querySelector("#save-btn"),
        document.querySelector('[data-testid="user-card"]'),
        document.querySelector('input[name="email-field"]'),
        document.querySelector('[data-pick="row3"]'),
        document.querySelector('[data-pick="the-path"]'),
        document.querySelector('[data-pick="deep-span"]'),
      ];

      const results = [];
      for (const el of targets) {
        const before = window.__events.length;
        // dispatchEvent (not el.click()) so SVG elements work too — SVGElement has
        // no .click(). content.js listens on document in the capture phase.
        el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        const ev = window.__events[before]; // the event this click produced
        const sel = ev && ev.selector;
        let matches = [];
        try { matches = Array.from(document.querySelectorAll(sel)); } catch (e) { matches = []; }
        results.push({
          tag: el.tagName.toLowerCase(),
          selector: sel,
          unique: matches.length === 1,
          identifiesTarget: matches.length === 1 && matches[0] === el,
        });
      }
      // --- 4. drive clicks on the ctx fixtures and capture describe() output ---
      function clickCtx(sel) {
        const el = document.querySelector(sel);
        const before = window.__events.length;
        el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        return window.__events[before]?.ctx || {};
      }
      const ctx = {
        refund: clickCtx('[data-ctx="refund-btn"]'),
        reason: clickCtx('[data-ctx="reason-input"]'),
        link: clickCtx('[data-ctx="track-link"]'),
        select: clickCtx('[data-ctx="state-select"]'),
        secret: clickCtx('[data-ctx="secret-input"]'),
      };
      const ctxChecks = {
        button_role: ctx.refund.role === "button",
        button_name: ctx.refund.name === "Issue refund",
        button_section: ctx.refund.section === "Order actions",
        input_role: ctx.reason.role === "textbox",
        input_name_from_label: ctx.reason.name === "Reason for refund",
        link_role: ctx.link.role === "link",
        link_href: ctx.link.href === "/track/123",
        link_section_from_heading: ctx.link.section === "Shipping",
        select_role: ctx.select.role === "combobox",
        select_selected: ctx.select.selected === "Submitted",
        // B2: a secret input keeps its role/inputType but drops the (token-bearing)
        // aria-labelledby name, so no secret rides into ctx.name.
        secret_name_suppressed: !ctx.secret.name,
        secret_no_token: !/eyJ[A-Za-z0-9_-]{6,}\./.test(JSON.stringify(ctx.secret)),
      };

      window.__results = {
        clicks: window.__events.filter((e) => e.kind === "click").length,
        results,
        allUnique: results.every((r) => r.unique),
        allIdentify: results.every((r) => r.identifiesTarget),
        ctx,
        ctxChecks,
        allCtxPass: Object.values(ctxChecks).every(Boolean),
      };
      // Render for eyeballing too.
      const pre = document.createElement("pre");
      pre.id = "out";
      pre.textContent = JSON.stringify(window.__results, null, 2);
      document.body.appendChild(pre);
    }
    // content.js attaches its click listener synchronously on the is-recording
    // reply, but give the event loop one tick to be safe.
    setTimeout(run, 50);
  </script>
</body>
</html>
